<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Registration Demo</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            
            <h2 class="card-title text-center mb-4 text-primary">Create Account 🚀</h2>
            
            <!-- Dynamic Notification Alert Box -->
            <div id="notificationAlert" class="alert alert-info d-none fade show" role="alert">
              <span id="notificationMessage">Notification status will appear here.</span>
            </div>

            <!-- Registration Form -->
            <form id="registrationForm" novalidate>
              
              <!-- Full Name -->
              <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
              </div>

              <!-- Email Address -->
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
  <!-- Password -->
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Register Now</button>
            </form>
          </div>
        </div>

        <p class="text-center text-muted small mt-3">Deployed via GitHub Actions CI/CD Pipeline ⚙️</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  <!-- Custom JS Handler -->
  <script src="script.js"></script>
</body>
</html>
